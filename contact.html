<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обратная связь</title>
</head>
<body>
    <div class="wrapper">
        <section class="feedback">
                <h2>Форма обратной связи</h2>
                <form action="https://httpbin.org/post" method="POST" enctype="multipart/form-data">
                    <div class="form">
                        <label for="fullname">ФИО:</label>
                        <input type="text" id="fullname" name="fullname" required>
                    </div>
                    
                    <div class="form">
                        <label for="email">Email:</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="form">
                        <label>Откуда узнали о нас:</label>
                        <div>
                            <label><input type="radio" name="source" value="ads" required> Реклама</label>
                            <label><input type="radio" name="source" value="friends"> Друзья</label>
                            <label><input type="radio" name="source" value="internet"> Интернет</label>
                        </div>
                    </div>

                    <div class="form">
                        <label for="requestType">Тип обращения:</label>
                        <select id="requestType" name="request_type">
                            <option value="complaint">Жалоба</option>
                            <option value="suggestion">Предложение</option>
                        </select>
                    </div>

                    <div class="form">
                        <label for="message">Текст сообщения:</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>

                    <div class="form">
                        <label for="attachment">Вложения:</label>
                        <input type="file" id="attachment" name="attachment">
                    </div>

                    <div class="form">
                        <label>
                            <input type="checkbox" name="consent" required>
                            Даю согласие на обработку персональных данных
                        </label>
                    </div>

                    <button type="submit">Отправить</button>
                </form>
        </section>
    </div>
</body>
</html>
